name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No lockfile is committed yet, so resolve from package.json ranges.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: API health check
        run: |
          node apps/api/dist/server.js &
          pid=$!
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/health; then
              kill "$pid"
              exit 0
            fi
            sleep 0.5
          done
          kill "$pid" || true
          echo "API did not answer /health"
          exit 1
